<div class="reset-password-container">
  
  <!-- Sidebar Esquerda - Imagem de Angola -->
  <div class="reset-password-sidebar">
    <img src="assets/images/angola-map.png" alt="Mapa de Angola" class="reset-password-map-bg" />
    <div class="reset-password-map-overlay"></div>

    <!-- Logo -->
    <div class="reset-password-logo">
      <div class="reset-password-logo-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="#d4a0a8">
          <path d="M12 2L2 7L12 12L22 7L12 2Z"/>
          <path d="M2 17L12 22L22 17"/>
          <path d="M2 12L12 17L22 12"/>
        </svg>
      </div>
      <span class="reset-password-logo-text">Economia com História</span>
    </div>

    <div class="reset-password-sidebar-footer">
      <p class="reset-password-sidebar-footer-text">Arquivo Digital do Pensamento Económico de Angola</p>
    </div>
  </div>

  <!-- Sidebar Direita -->
  <div class="reset-password-form-wrapper">
    <div class="reset-password-form-container">
      
      <!-- Header -->
      <div class="reset-password-form-header">
        <div style="margin-bottom: 16px;">
          <span class="reset-password-form-badge">RECUPERAÇÃO DE ACESSO</span>
        </div>
        <h1 class="reset-password-form-title">Criar nova senha</h1>
        <p class="reset-password-form-subtitle">Defina a nova palavra-passe associada ao link recebido por email</p>
      </div>

      <!-- Form Card -->
      <div class="reset-password-form-card">
        <form (ngSubmit)="handleSubmit($event)">
          
          <!-- Error -->
          <div *ngIf="errorMessage">
            <app-auth-feedback
              type="error"
              title="Não foi possível concluir"
              [message]="errorMessage">
            </app-auth-feedback>
          </div>

          <!-- Success -->
          <div *ngIf="successMessage">
            <app-auth-feedback
              type="success"
              title="Senha atualizada"
              [message]="successMessage">
            </app-auth-feedback>
          </div>

          <!-- Password -->
          <div class="reset-password-form-group">
            <label class="reset-password-label">Nova palavra-passe</label>
            <input type="password" [(ngModel)]="password" name="password" placeholder="••••••••" required
                   class="reset-password-input">
          </div>

          <!-- Confirm Password -->
          <div class="reset-password-form-group">
            <label class="reset-password-label">Confirmar palavra-passe</label>
            <input type="password" [(ngModel)]="confirmPassword" name="confirmPassword" placeholder="••••••••" required
                   class="reset-password-input">
          </div>

          <!-- Submit -->
          <button type="submit" [disabled]="loading" class="reset-password-btn">
            <span *ngIf="!loading">Redefinir senha</span>
            <span *ngIf="loading">A redefinir...</span>
          </button>
        </form>

        <!-- Back Link -->
        <div class="reset-password-back">
          <button type="button" (click)="goToLogin()" class="reset-password-back-link">
            Voltar ao login
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
