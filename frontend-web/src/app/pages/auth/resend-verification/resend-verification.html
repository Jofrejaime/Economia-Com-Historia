<div class="forgot-password-container">
  <div class="forgot-password-sidebar">
    <div class="forgot-password-decoration-top"></div>
    <div class="forgot-password-decoration-bottom"></div>

    <div class="forgot-password-logo">
      <div class="forgot-password-logo-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="#d4a0a8">
          <path d="M12 2L2 7L12 12L22 7L12 2Z"/>
          <path d="M2 17L12 22L22 17"/>
          <path d="M2 12L12 17L22 12"/>
        </svg>
      </div>
      <span class="forgot-password-logo-text">Economia com História</span>
    </div>

    <div class="forgot-password-content">
      <div>
        <div class="forgot-password-badge">VERIFICAÇÃO DE CONTA</div>
        <h2 class="forgot-password-title">Reenviar verificação</h2>
        <p class="forgot-password-description">
          Caso não tenha recebido o email, podemos enviar outro link de verificação.
        </p>
      </div>
    </div>
  </div>

  <div class="forgot-password-form-wrapper">
    <div class="forgot-password-form-container">
      <div class="forgot-password-form-header">
        <div class="forgot-password-form-badge">CONFIRMAR EMAIL</div>
        <h1 class="forgot-password-form-title">Reenviar email</h1>
        <p class="forgot-password-form-subtitle">Indique o email da conta para reenviar a verificação</p>
      </div>

      <div class="forgot-password-form-card">
        <form (ngSubmit)="handleSubmit($event)">
          <div *ngIf="errorMessage">
            <app-auth-feedback
              type="error"
              title="Não foi possível reenviar"
              [message]="errorMessage">
            </app-auth-feedback>
          </div>

          <div *ngIf="successMessage">
            <app-auth-feedback
              type="success"
              title="Email reenviado"
              [message]="successMessage">
            </app-auth-feedback>
          </div>

          <div class="forgot-password-form-group">
            <label class="forgot-password-label">Email institucional</label>
            <input
              type="email"
              [(ngModel)]="email"
              name="email"
              placeholder="nome@instituicao.edu"
              required
              class="forgot-password-input" />
          </div>

          <button
            type="submit"
            [disabled]="loading"
            class="forgot-password-btn">
            <span *ngIf="!loading">Reenviar email</span>
            <span *ngIf="loading">A reenviar...</span>
          </button>
        </form>

        <div class="forgot-password-back">
          <button type="button" (click)="goToLogin()" class="forgot-password-back-link">Voltar ao login</button>
        </div>
      </div>
    </div>
  </div>
</div>
