<div class="forgot-password-container">
  
  <!-- Sidebar Esquerda - Imagem de Angola -->
  <div class="forgot-password-sidebar">
    <img src="assets/images/angola-map.png" alt="Mapa de Angola" class="forgot-password-map-bg" />
    <div class="forgot-password-map-overlay"></div>

    <!-- Logo -->
    <div class="forgot-password-logo">
      <div class="forgot-password-logo-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="#d4a0a8">
          <path d="M12 2L2 7L12 12L22 7L12 2Z"/>
          <path d="M2 17L12 22L22 17"/>
          <path d="M2 12L12 17L22 12"/>
        </svg>
      </div>
      <span class="forgot-password-logo-text">Economia com História</span>
    </div>

    <div class="forgot-password-sidebar-footer">
      <p class="forgot-password-sidebar-footer-text">Arquivo Digital do Pensamento Económico de Angola</p>
    </div>
  </div>

  <!-- Sidebar Direita - Formulário -->
  <div class="forgot-password-form-wrapper">
    <div class="forgot-password-form-container">
      
      <!-- Header -->
      <div class="forgot-password-form-header">
        <div class="forgot-password-form-badge">REDEFINIR ACESSO</div>
        <h1 class="forgot-password-form-title">Recuperar senha</h1>
        <p class="forgot-password-form-subtitle">Vamos enviar um link seguro para redefinir a sua palavra-passe</p>
      </div>

      <!-- Form -->
      <div class="forgot-password-form-card">
        <form (ngSubmit)="handleSubmit($event)">
          
          <!-- Error Message -->
          <div *ngIf="errorMessage">
            <app-auth-feedback
              type="error"
              title="Pedido não enviado"
              [message]="errorMessage">
            </app-auth-feedback>
          </div>

          <!-- Success Message -->
          <div *ngIf="successMessage">
            <app-auth-feedback
              type="success"
              title="Pedido enviado"
              [message]="successMessage">
            </app-auth-feedback>
          </div>

          <!-- Email Input -->
          <div class="forgot-password-form-group">
            <label class="forgot-password-label">Email institucional</label>
            <input 
              type="email" 
              [(ngModel)]="email" 
              name="email" 
              placeholder="nome@instituicao.edu" 
              required
              class="forgot-password-input" />
          </div>

          <!-- Submit Button -->
          <button 
            type="submit" 
            [disabled]="loading" 
            class="forgot-password-btn">
            <span *ngIf="!loading">Enviar link</span>
            <span *ngIf="loading">A enviar...</span>
          </button>
        </form>

        <!-- Back to Login -->
        <div class="forgot-password-back">
          <a routerLink="/auth/login" class="forgot-password-back-link">Voltar ao login</a>
        </div>
      </div>
    </div>
  </div>

</div>
