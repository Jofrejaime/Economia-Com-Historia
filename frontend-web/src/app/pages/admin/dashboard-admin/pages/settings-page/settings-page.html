<div class="settings-container">

  <!-- Page Header -->
  <div class="page-header">
    <div>
      <h1 class="page-title">Configurações</h1>
      <p class="page-subtitle">Gestão de definições e preferências do sistema.</p>
    </div>
  </div>

  <!-- Erro -->
  <div *ngIf="error" style="padding:16px;background:#fef2f2;color:#dc2626;border-radius:8px;margin-bottom:20px;">
    {{ error }}
  </div>

  <!-- Loading -->
  <div *ngIf="loading" style="text-align:center; padding:40px; color:#64748b;">
    A carregar configurações...
  </div>

  <!-- Empty -->
  <div *ngIf="!loading && settings.length === 0 && !error" style="text-align:center; padding:40px; color:#64748b;">
    Nenhuma configuração disponível.
  </div>

  <!-- Settings Form (dinâmico, agrupado por group vindo do backend) -->
  <div class="settings-form" *ngIf="!loading && settings.length > 0">

    <div class="settings-section" *ngFor="let grouped of groupedSettings; trackBy: trackByGroup">
      <h2 class="section-title">{{ grouped.label }}</h2>

      <div *ngFor="let setting of grouped.items; trackBy: trackBySettingKey">

        <!-- Boolean → toggle -->
        <div class="form-group toggle" *ngIf="setting.type === 'boolean'">
          <div class="toggle-label">
            <span class="toggle-title">{{ setting.description || setting.key }}</span>
            <span class="toggle-desc" *ngIf="setting.draftValue !== setting.originalValue">Alteração não guardada</span>
          </div>
          <label class="toggle-switch">
            <input type="checkbox" [(ngModel)]="setting.draftValue" (ngModelChange)="onFieldChanged(setting)">
            <span class="toggle-slider"></span>
          </label>
        </div>

        <!-- Integer / Float → number -->
        <div class="form-group" *ngIf="setting.type === 'integer' || setting.type === 'float'">
          <label>
            {{ setting.description || setting.key }}
            <span *ngIf="setting.draftValue !== setting.originalValue" style="color:#8B1E2D; font-size:12px;"> (alterado)</span>
          </label>
          <input type="number" [(ngModel)]="setting.draftValue" (ngModelChange)="onFieldChanged(setting)"
                 class="form-input form-input-sm" [step]="setting.type === 'float' ? 0.1 : 1">
        </div>

        <!-- JSON → textarea -->
        <div class="form-group" *ngIf="setting.type === 'json'">
          <label>
            {{ setting.description || setting.key }}
            <span *ngIf="setting.draftValue !== setting.originalValue" style="color:#8B1E2D; font-size:12px;"> (alterado)</span>
          </label>
          <textarea [(ngModel)]="setting.draftValue" (ngModelChange)="onFieldChanged(setting)" rows="3" class="form-input"></textarea>
        </div>

        <!-- String (default) → text -->
        <div class="form-group" *ngIf="setting.type === 'string'">
          <label>
            {{ setting.description || setting.key }}
            <span *ngIf="setting.draftValue !== setting.originalValue" style="color:#8B1E2D; font-size:12px;"> (alterado)</span>
          </label>
          <input type="text" [(ngModel)]="setting.draftValue" (ngModelChange)="onFieldChanged(setting)" class="form-input">
        </div>

      </div>
    </div>

    <!-- Action Buttons -->
    <div class="form-actions">
      <button class="btn-save" (click)="saveSettings()" [disabled]="saving || !hasAnyChanges">
        {{ saving ? 'A guardar...' : 'Guardar Configurações' }}
      </button>
      <button class="btn-reset" (click)="resetChanges()" [disabled]="!hasAnyChanges">Descartar Alterações</button>
    </div>
  </div>
</div>
