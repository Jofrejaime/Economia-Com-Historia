<header class="app-header">
  <div class="app-header-container">
    <div class="app-header-nav">
      <div class="app-header-logo" routerLink="/home" style="cursor: pointer;">
        <div class="app-header-logo-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path>
              <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path>
            </svg>
        </div>
        <span class="app-header-logo-text">Economia com História</span>
      </div>

      <button class="app-header-mobile-btn" (click)="toggleMobileMenu()" aria-label="Menu">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#8B1E2D" stroke-width="2">
          <line x1="3" y1="12" x2="21" y2="12"/>
          <line x1="3" y1="6" x2="21" y2="6"/>
          <line x1="3" y1="18" x2="21" y2="18"/>
        </svg>
      </button>

      <nav class="app-header-links" [class.mobile-open]="mobileMenuOpen">
        <a routerLink="/home" routerLinkActive="active" (click)="closeMobileMenu()">Início</a>
        <a routerLink="/contents" routerLinkActive="active" (click)="closeMobileMenu()">Conteúdos</a>
        <a routerLink="/forum/community" routerLinkActive="active" (click)="closeMobileMenu()">Comunidade</a>
        <a routerLink="/quiz" routerLinkActive="active" (click)="closeMobileMenu()">Quiz</a>

        <div class="app-header-mobile-extra" *ngIf="mobileMenuOpen">
          <div class="app-header-mobile-actions" *ngIf="isAuthenticated; else mobileGuestActions">
            <div class="app-header-avatar-mobile" routerLink="/auth/perfil" (click)="closeMobileMenu()">
              <img *ngIf="hasAvatar()" [src]="avatarUrl" alt="Avatar" (error)="onAvatarLoadError()" />
              <svg *ngIf="!hasAvatar()" width="20" height="20" viewBox="0 0 24 24" fill="white">
                <circle cx="12" cy="8" r="4"/>
                <path d="M 12 14 C 7.6 14 4 16.7 4 20 L 20 20 C 20 16.7 16.4 14 12 14 Z"/>
              </svg>
              <span>{{ displayName }}</span>
            </div>
            <button class="app-header-logout-mobile" (click)="logout()">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8B1E2D" stroke-width="2">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                <polyline points="16 17 21 12 16 7"/>
                <line x1="21" y1="12" x2="9" y2="12"/>
              </svg>
              <span>Sair</span>
            </button>
          </div>

          <ng-template #mobileGuestActions>
            <div class="app-header-mobile-actions">
              <button class="app-header-auth-btn app-header-auth-btn--outline" (click)="goToLogin(); closeMobileMenu()">
                Entrar
              </button>
              <button class="app-header-auth-btn app-header-auth-btn--solid" (click)="goToRegister(); closeMobileMenu()">
                Criar conta
              </button>
            </div>
          </ng-template>
        </div>
      </nav>

      <div class="app-header-icons" *ngIf="isAuthenticated; else publicActions">
        <button class="app-header-notification-btn" (click)="goToNotifications()" title="Notificações" aria-label="Notificações">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#8B1E2D" stroke-width="1.8">
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
            <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
          </svg>
          <span class="app-header-notification-badge" *ngIf="unreadCount > 0">
            {{ unreadCount > 9 ? '9+' : unreadCount }}
          </span>
        </button>

        <div class="app-header-avatar" routerLink="/auth/perfil" title="Perfil">
          <img *ngIf="hasAvatar()" [src]="avatarUrl" alt="Avatar" (error)="onAvatarLoadError()" />
          <svg *ngIf="!hasAvatar()" width="20" height="20" viewBox="0 0 24 24" fill="white">
            <circle cx="12" cy="8" r="4"/>
            <path d="M 12 14 C 7.6 14 4 16.7 4 20 L 20 20 C 20 16.7 16.4 14 12 14 Z"/>
          </svg>
        </div>

        <button class="app-header-logout" (click)="logout()" title="Terminar Sessão" aria-label="Logout">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8B1E2D" stroke-width="2">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
            <polyline points="16 17 21 12 16 7"/>
            <line x1="21" y1="12" x2="9" y2="12"/>
          </svg>
        </button>
      </div>

      <ng-template #publicActions>
        <div class="app-header-icons">
          <button
            type="button"
            class="app-header-auth-btn app-header-auth-btn--outline"
            (click)="goToLogin()"
            title="Entrar"
            aria-label="Entrar">
            Entrar
          </button>
          <button
            type="button"
            class="app-header-auth-btn app-header-auth-btn--solid"
            (click)="goToRegister()"
            title="Criar conta"
            aria-label="Criar conta">
            Criar conta
          </button>
        </div>
      </ng-template>
    </div>
  </div>
</header>
